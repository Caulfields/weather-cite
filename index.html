<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Airport City Temperature Peaks</title>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="shortcut icon" href="favicon/favicon.ico">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="controls">
          <div class="day-tabs" role="tablist" aria-label="Market day">
            <button class="day-tab" id="todayTab" type="button" role="tab" aria-selected="true">Today</button>
            <button class="day-tab" id="tomorrowTab" type="button" role="tab" aria-selected="false">Tomorrow</button>
          </div>
          <button class="control-button" id="sortButton" type="button" aria-pressed="false">Sort by peak</button>
          <button class="control-button" id="dimButton" type="button" aria-pressed="false">Dim past</button>
          <button class="control-button" id="hideClosedButton" type="button" aria-pressed="false">Hide closed</button>
          <button class="control-button" id="favoritesOnlyButton" type="button" aria-pressed="false">Only favorites</button>
          <label class="shares-control">Shares <input id="sharesInput" type="number" min="1" value="5"></label>
        </div>
        <div class="user-clock">
          <strong id="userClock">--:--</strong>
        </div>
      </header>

      <section class="cards" id="cards" aria-live="polite"></section>
    </main>

    <template id="cityCardTemplate">
      <article class="city-card">
        <div class="card-body">
          <div class="card-head">
            <h2></h2>
            <div class="card-head-actions">
              <a class="poly-link" target="_blank" rel="noopener noreferrer" title="Open on Polymarket">P</a>
              <button class="favorite-button" type="button" aria-pressed="false" aria-label="Add to favorites" title="Add to favorites">☆</button>
              <div class="status-dot" title="Loading weather"></div>
            </div>
          </div>

          <div class="local-clock">
            <span>Local time</span>
            <strong class="city-time">--:--</strong>
          </div>

          <dl class="metrics">
            <div>
              <dt>Forecast high</dt>
              <dd class="max-temp">Loading</dd>
            </div>
            <div>
              <dt>Date</dt>
              <dd class="forecast-date">--</dd>
            </div>
            <div>
              <dt>Peak at airport</dt>
              <dd class="local-peak">--</dd>
            </div>
            <div>
              <dt>Peak in your time</dt>
              <dd class="user-peak">--</dd>
            </div>
          </dl>

          <div class="market-positions">
            <span>Polymarket</span>
            <div class="position-list">Loading</div>
          </div>
        </div>
      </article>
    </template>

    <div class="modal-overlay" id="tradeModal">
      <div class="modal">
        <div class="modal-head">
          <h3 id="modalCityName"></h3>
          <button class="modal-close" id="modalClose">&times;</button>
        </div>
        <div class="modal-positions" id="modalPositions"></div>
        <div class="modal-total" id="modalTotal">Cost: $0.00</div>
        <div class="modal-profit" id="modalProfit">Profit: $0.00</div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
